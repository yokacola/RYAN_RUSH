<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- 포털 사이트(구글, 네이버 등) 검색 수집 및 노출 완전 차단 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  
  <title>달려라 리안! (RYAN RUSH)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
      <!-- 좌상단 전체화면 버튼 -->
      <button id="fullscreen-btn" aria-label="전체화면 전환" title="전체화면">
        <svg id="fs-icon-enter" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg id="fs-icon-exit" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6 7 7M10 10H4m6 0V4m0 6L3 3m17 7h-6m0 0V4m0 6 7-7"></path>
        </svg>
      </button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
